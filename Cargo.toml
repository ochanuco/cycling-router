[workspace]
resolver = "2"
members = ["crates/router-core", "crates/router-wasm", "crates/router-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ochanuco/cycling-router"

[workspace.dependencies]
router-core = { path = "crates/router-core" }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "0.3"

# WASM は Cloudflare Workers の 128MB / 30s 制約下で動くため、サイズと速度の
# 両方を詰める。lto + codegen-units=1 は wasm バイナリを実測で縮める。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
