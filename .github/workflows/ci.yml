name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/rust.yml@737e6affb5e43803670afb13376dded4731e3388 # v1.5.0
    with:
      targets: wasm32-unknown-unknown
      tools: wasm-pack
      setup-node: "24"
      run: |
        cargo fmt --all --check
        cargo clippy --workspace --all-targets -- -D warnings
        cargo clippy -p router-core -p router-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings
        cargo test --workspace
        cargo build -p router-wasm --release --target wasm32-unknown-unknown
        cargo build -p router-cli --release
        wasm-pack test --node crates/router-core
        ./scripts/build-wasm.sh
        node -e "
        const m = require('./dist/nodejs/router_wasm.js');
        const expected = ['astar', 'route_ch', 'route_distances'];
        for (const fn of expected) {
          if (typeof m[fn] !== 'function') throw new Error('missing export: ' + fn);
        }
        const d = m.route_distances(
          new Float64Array([135.0, 34.0, 135.01, 34.0]),
          new Float64Array([135.005, 34.001])
        );
        if (!(d[0] > 100 && d[0] < 125)) throw new Error('route_distances out of range: ' + d[0]);
        const r = m.astar(
          new Float64Array([135.0, 34.0, 135.001, 34.0, 135.002, 34.0]),
          new Float64Array([0, 1, 100, 1, 0, 100, 1, 2, 100, 2, 1, 100]),
          0, 2
        );
        const got = Array.from(r).join(',');
        if (got !== '200,0,1,2') throw new Error('astar mismatch: ' + got);
        console.log('smoke ok: route_distances=' + d[0].toFixed(1) + 'm astar=[' + got + ']');
        "
        test -f dist/bundler/router_wasm_worker.js
        test -f dist/bundler/router_wasm_worker.d.ts
        node scripts/check-dts.mjs
