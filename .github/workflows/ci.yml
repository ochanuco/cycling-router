name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test (native)
        run: cargo test --workspace

      # Cloudflare Workers 向けのビルドが通ることを保証する。router-core の
      # js_sys 依存は wasm32 ターゲットでのみ有効になるため、ここで初めて検証される。
      - name: Build wasm target
        run: cargo build -p router-wasm --release --target wasm32-unknown-unknown

      - name: Build native CLI
        run: cargo build -p router-cli --release
