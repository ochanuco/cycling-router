name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 整形と lint を CI で固定して再発を防ぐ。--all-targets はテストコードも
      # 対象にする (テストだけ警告が溜まるのを避ける)。
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 上の Clippy はホストターゲットなので、`#[cfg(target_arch = "wasm32")]`
      # で囲われたコード (route_ch の Uint8Array 経路など) を一切見ていない。
      # 下の "Build wasm target" は通るが -D warnings が無く lint も走らない。
      # router-cli はホスト専用なので対象から外す。
      - name: Clippy (wasm32)
        run: cargo clippy -p router-core -p router-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Test (native)
        run: cargo test --workspace

      # Cloudflare Workers 向けのビルドが通ることを保証する。router-core の
      # js_sys 依存は wasm32 ターゲットでのみ有効になるため、ここで初めて検証される。
      - name: Build wasm target
        run: cargo build -p router-wasm --release --target wasm32-unknown-unknown

      - name: Build native CLI
        run: cargo build -p router-cli --release

      - name: Install wasm-pack
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: wasm-pack

      # release.yml と同じ経路で成果物を作り、壊れていたら PR 時点で気づけるように
      # する。cargo build だけでは wasm-bindgen glue と Workers wrapper の同梱まで
      # 検証されない。
      - name: Build distribution artifacts
        run: ./scripts/build-wasm.sh

      - name: Smoke test built wasm (nodejs target)
        run: |
          node -e "
          const m = require('./dist/nodejs/router_wasm.js');
          const expected = ['astar', 'route_ch', 'route_distances'];
          for (const fn of expected) {
            if (typeof m[fn] !== 'function') throw new Error('missing export: ' + fn);
          }
          // ルート (135.0,34.0)-(135.01,34.0) に対し (135.005,34.001) は北へ約111m
          const d = m.route_distances(
            new Float64Array([135.0, 34.0, 135.01, 34.0]),
            new Float64Array([135.005, 34.001])
          );
          if (!(d[0] > 100 && d[0] < 125)) throw new Error('route_distances out of range: ' + d[0]);
          // 3ノード直鎖: 総距離 200m + 経路 [0,1,2]
          const r = m.astar(
            new Float64Array([135.0, 34.0, 135.001, 34.0, 135.002, 34.0]),
            new Float64Array([0, 1, 100, 1, 0, 100, 1, 2, 100, 2, 1, 100]),
            0, 2
          );
          const got = Array.from(r).join(',');
          if (got !== '200,0,1,2') throw new Error('astar mismatch: ' + got);
          console.log('smoke ok: route_distances=' + d[0].toFixed(1) + 'm astar=[' + got + ']');
          "

      - name: Verify Workers wrapper is bundled
        run: test -f dist/bundler/router_wasm_worker.js
