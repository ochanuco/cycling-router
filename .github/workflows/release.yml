name: Release

# tag を push すると WASM 成果物を作って Release に添付する。
# 利用側 (ride-oasis) はこの Release からダウンロードして Workers にバンドルする。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: wasm-pack

      - name: Build wasm (bundler / nodejs / web)
        run: ./scripts/build-wasm.sh

      # tag 名は run ブロックへ直接展開せず env 経由で渡す。展開すると tag 名が
      # そのままシェルとして評価されうるため。ファイル名にはスラッシュを含めない
      # よう `/` を `-` に潰す (v1.0/rc のような tag でもパスが壊れない)。
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          safe_tag="${TAG//\//-}"
          archive="cycling-router-wasm-${safe_tag}.tar.gz"
          tar -czf "$archive" -C dist .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "$ARCHIVE"
